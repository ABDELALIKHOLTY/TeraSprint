services:
  db:
    image: pgvector/pgvector:pg16
    container_name: terasprint_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: terasprint
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: terasprint_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
      - phoenix
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - OPENAI_API_KEY=dummy_key_for_mem0_init
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: terasprint_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules 
    depends_on:
      - backend

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: terasprint_phoenix
    ports:
      - "6006:6006"
      - "4317:4317"
      - "4318:4318"
    restart: always

volumes:
  postgres_data:
