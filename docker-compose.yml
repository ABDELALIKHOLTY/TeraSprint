services:
  db:
    image: pgvector/pgvector:pg16
    container_name: terasprint_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: terasprint
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: terasprint_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
      - phoenix
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - OPENAI_API_KEY=dummy_key_for_mem0_init
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: terasprint_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules 
    depends_on:
      - backend

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: terasprint_phoenix
    ports:
      - "6006:6006"
      - "4317:4317"
      - "4318:4318"
    restart: always

  minio:
    image: quay.io/minio/minio:latest
    container_name: terasprint_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: terasprint_minio_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5 &&
      mc alias set teraminio http://minio:9000 minioadmin minioadmin &&
      mc mb teraminio/avatars --ignore-existing &&
      mc anonymous set public teraminio/avatars &&
      mc mb teraminio/project-files --ignore-existing &&
      mc anonymous set public teraminio/project-files
      "

volumes:
  postgres_data:
  minio_data:
