<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>frontend</title>
  </head>
  <body class="font-sans antialiased text-gray-900 bg-white dark:bg-[#09090b] dark:text-gray-100">
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML = '<div style="color:red;padding:20px;font-family:monospace;z-index:9999;position:absolute;background:white;width:100%;height:100%;">' + 
          '<h2>Runtime Error</h2>' +
          '<p><strong>Message:</strong> ' + e.message + '</p>' +
          '<p><strong>File:</strong> ' + e.filename + ':' + e.lineno + ':' + e.colno + '</p>' +
          '<p><strong>Error Obj:</strong> ' + (e.error && e.error.stack ? e.error.stack : String(e.error)) + '</p>' +
          '</div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML = '<div style="color:red;padding:20px;font-family:monospace;z-index:9999;position:absolute;background:white;width:100%;height:100%;">' + 
          '<h2>Unhandled Promise Rejection</h2>' +
          '<p><strong>Reason:</strong> ' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason)) + '</p>' +
          '</div>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
